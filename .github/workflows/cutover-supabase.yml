# Apply Makerkit + DuaPrayer migrations to production Supabase, and sync
# required Makerkit env aliases onto the Vercel project.
#
# Secrets:
#   VERCEL_TOKEN              (already used for deploys) — diagnose + env sync
#   SUPABASE_ACCESS_TOKEN     https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD      Database password for itcoxbkhcwlsjpcwawyl
#   SUPABASE_DB_WEBHOOK_SECRET (optional) — synced to Vercel if present
#
# Run: Actions → Cutover Supabase Production → Run workflow
# Also runs on push when this workflow file changes.

name: Cutover Supabase Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-supabase.yml'
      - 'apps/web/supabase/migrations/**'
      - 'scripts/cutover-db.sh'

env:
  SUPABASE_PROJECT_REF: itcoxbkhcwlsjpcwawyl
  VERCEL_ORG_ID: team_km2T92NwivBy9c85XLjhTScR
  VERCEL_PROJECT_ID: prj_8sQGGuKxXAfJdnHeRXuX0jh15dIk

jobs:
  diagnose-and-sync-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Vercel token
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN missing — skipping diagnose/env sync"
          fi

      - name: Install Vercel CLI
        if: steps.vercel.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Pull production env (names only + health probe)
        if: steps.vercel.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          ENV_FILE=".vercel/.env.production.local"
          echo "== Production env keys =="
          # Print KEY names only
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync(".vercel/.env.production.local", "utf8");
            const keys = [];
            for (const line of text.split("\n")) {
              const t = line.trim();
              if (!t || t.startsWith("#")) continue;
              const i = t.indexOf("=");
              if (i > 0) keys.push(t.slice(0, i));
            }
            keys.sort().forEach((k) => console.log(k));
            const need = [
              "NEXT_PUBLIC_SUPABASE_URL",
              "NEXT_PUBLIC_SUPABASE_PUBLIC_KEY",
              "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
              "NEXT_PUBLIC_SUPABASE_ANON_KEY",
              "SUPABASE_SECRET_KEY",
              "SUPABASE_SERVICE_ROLE_KEY",
              "NEXT_PUBLIC_SITE_URL",
              "NEXT_PUBLIC_APP_URL",
              "SUPABASE_DB_WEBHOOK_SECRET",
              "DATABASE_URL",
            ];
            console.log("== presence ==");
            for (const k of need) console.log(`${k}=${keys.includes(k) ? "yes" : "no"}`);
          '
          echo "== REST probe (no secrets printed) =="
          node <<'NODE'
          const fs = require("fs");
          const env = Object.fromEntries(
            fs.readFileSync(".vercel/.env.production.local", "utf8")
              .split("\n")
              .map((l) => l.trim())
              .filter((l) => l && !l.startsWith("#") && l.includes("="))
              .map((l) => {
                const i = l.indexOf("=");
                let v = l.slice(i + 1);
                if (
                  (v.startsWith('"') && v.endsWith('"')) ||
                  (v.startsWith("'") && v.endsWith("'"))
                ) {
                  v = v.slice(1, -1);
                }
                return [l.slice(0, i), v];
              }),
          );
          const url = (env.NEXT_PUBLIC_SUPABASE_URL || "").replace(/\/$/, "");
          const key =
            env.SUPABASE_SECRET_KEY ||
            env.SUPABASE_SERVICE_ROLE_KEY ||
            env.NEXT_PUBLIC_SUPABASE_PUBLIC_KEY ||
            env.NEXT_PUBLIC_SUPABASE_ANON_KEY ||
            env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ||
            "";
          console.log("url_host", url.replace(/^https?:\/\//, "").slice(0, 48));
          console.log("key_kind", env.SUPABASE_SECRET_KEY ? "secret" : env.SUPABASE_SERVICE_ROLE_KEY ? "service_role" : "public");
          console.log("key_len", key.length);
          const tables = ["config", "accounts", "duas", "categories", "site_settings"];
          (async () => {
            for (const t of tables) {
              try {
                const res = await fetch(`${url}/rest/v1/${t}?select=*&limit=1`, {
                  headers: {
                    apikey: key,
                    Authorization: `Bearer ${key}`,
                    Accept: "application/json",
                  },
                });
                const body = await res.text();
                const hint = body.includes("does not exist")
                  ? "missing_relation"
                  : body.includes("Invalid API key")
                    ? "invalid_key"
                    : body.slice(0, 80).replace(/\s+/g, " ");
                console.log(`${t}: HTTP ${res.status} ${hint}`);
              } catch (e) {
                console.log(`${t}: ERROR ${e.message}`);
              }
            }
          })();
          NODE

      - name: Sync Makerkit env aliases on Vercel
        if: steps.vercel.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_DB_WEBHOOK_SECRET: ${{ secrets.SUPABASE_DB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # Load pulled env without printing values
          set -a
          # shellcheck disable=SC1091
          source <(node -e '
            const fs=require("fs");
            for (const line of fs.readFileSync(".vercel/.env.production.local","utf8").split("\n")) {
              const t=line.trim();
              if(!t||t.startsWith("#")||!t.includes("=")) continue;
              const i=t.indexOf("=");
              const k=t.slice(0,i);
              let v=t.slice(i+1);
              if((v.startsWith("\"")&&v.endsWith("\""))||(v.startsWith("'\''")&&v.endsWith("'\''"))) v=v.slice(1,-1);
              if(["NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY","NEXT_PUBLIC_SUPABASE_ANON_KEY","NEXT_PUBLIC_APP_URL","NEXT_PUBLIC_SUPABASE_URL"].includes(k)) {
                process.stdout.write(k+"="+JSON.stringify(v)+"\n");
              }
            }
          ')
          set +a

          upsert_env() {
            local key="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "skip $key (empty)"
              return 0
            fi
            # Remove existing production env with same key (ignore errors)
            local ids
            ids="$(curl -sS "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              | node -e '
                const key=process.argv[1];
                const j=JSON.parse(require("fs").readFileSync(0,"utf8"));
                const envs=j.envs||j||[];
                for (const e of envs) {
                  if (e.key===key && (e.target||[]).includes("production")) process.stdout.write(e.id+"\n");
                }
              ' "$key")"
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              curl -sS -X DELETE \
                "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_ORG_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" >/dev/null || true
            done <<< "$ids"
            curl -sS -X POST \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&upsert=true" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(node -e 'const[k,v]=process.argv.slice(1); process.stdout.write(JSON.stringify({key:k,value:v,type:"encrypted",target:["production"]}))' "$key" "$value")" \
              | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log("upserted", j.key||j.error||j);'
          }

          PUBLIC_KEY="${NEXT_PUBLIC_SUPABASE_PUBLIC_KEY:-}"
          if [ -z "$PUBLIC_KEY" ]; then
            PUBLIC_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          fi
          upsert_env "NEXT_PUBLIC_SITE_URL" "https://www.duaprayer.com"
          upsert_env "NEXT_PUBLIC_SUPABASE_PUBLIC_KEY" "$PUBLIC_KEY"
          if [ -n "${SUPABASE_DB_WEBHOOK_SECRET:-}" ]; then
            upsert_env "SUPABASE_DB_WEBHOOK_SECRET" "$SUPABASE_DB_WEBHOOK_SECRET"
          else
            echo "SUPABASE_DB_WEBHOOK_SECRET secret not set — skipped"
          fi
          echo "Env sync complete."

      - name: Redeploy production for NEXT_PUBLIC_* env
        if: steps.vercel.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            curl -sS -X POST "$VERCEL_DEPLOY_HOOK_URL" -d "ref=main" --fail-with-body
            echo
            echo "Triggered deploy hook after env sync"
          else
            echo "No VERCEL_DEPLOY_HOOK_URL — skipping redeploy (CLI deploy on next main push)"
          fi

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: diagnose-and-sync-env
    steps:
      - name: Check migration secrets
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN and/or SUPABASE_DB_PASSWORD missing."
            echo "Add them under repo Actions secrets, then re-run this workflow."
            echo "Until then https://www.duaprayer.com/api/healthcheck stays database:false."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: corepack enable && pnpm install --filter web...

      - name: Link and push migrations
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm exec supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          pnpm exec supabase db push --include-all
          echo "Migrations pushed."

      - name: Verify production healthcheck
        if: always()
        env:
          MIGRATE_READY: ${{ steps.creds.outputs.ready }}
        run: |
          set -euo pipefail
          sleep 5
          BODY="$(curl -sS "https://www.duaprayer.com/api/healthcheck" || true)"
          echo "$BODY"
          if echo "$BODY" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); process.exit(j?.services?.database===true?0:1)'; then
            echo "database healthy"
            exit 0
          fi
          echo "database still unhealthy — need Makerkit migrations on itcoxbkhcwlsjpcwawyl"
          # Soft-pass when migration secrets are not configured yet.
          if [ "$MIGRATE_READY" = "true" ]; then
            exit 1
          fi
          exit 0
