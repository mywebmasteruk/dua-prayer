# Apply Makerkit + DuaPrayer migrations to production Supabase.
#
# Preferred: Actions → Cutover Supabase Production → Run workflow
#   Paste SUPABASE_ACCESS_TOKEN + DB password into the inputs (or set repo secrets).
#
# Secrets (optional if inputs provided):
#   VERCEL_TOKEN, SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
#   SUPABASE_DB_WEBHOOK_SECRET

name: Cutover Supabase Production
# cutover-attempt: 4

on:
  workflow_dispatch:
    inputs:
      supabase_access_token:
        description: Supabase personal access token (dashboard → Account → Access Tokens)
        required: false
        type: string
      supabase_db_password:
        description: Database password for project itcoxbkhcwlsjpcwawyl
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/cutover-supabase.yml'
      - 'apps/web/supabase/migrations/**'
      - 'scripts/cutover-db.sh'

env:
  SUPABASE_PROJECT_REF: itcoxbkhcwlsjpcwawyl
  VERCEL_ORG_ID: team_km2T92NwivBy9c85XLjhTScR
  VERCEL_PROJECT_ID: prj_8sQGGuKxXAfJdnHeRXuX0jh15dIk

jobs:
  diagnose-and-sync-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check Vercel token
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.vercel.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Pull production env + REST probe
        if: steps.vercel.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          node <<'NODE'
          const fs = require("fs");
          const env = Object.fromEntries(
            fs.readFileSync(".vercel/.env.production.local", "utf8")
              .split("\n")
              .map((l) => l.trim())
              .filter((l) => l && !l.startsWith("#") && l.includes("="))
              .map((l) => {
                const i = l.indexOf("=");
                let v = l.slice(i + 1);
                if (
                  (v.startsWith('"') && v.endsWith('"')) ||
                  (v.startsWith("'") && v.endsWith("'"))
                )
                  v = v.slice(1, -1);
                return [l.slice(0, i), v];
              }),
          );
          const keys = Object.keys(env).sort();
          console.log("env_keys", keys.join(","));
          const url = (env.NEXT_PUBLIC_SUPABASE_URL || "").replace(/\/$/, "");
          const key =
            env.SUPABASE_SECRET_KEY ||
            env.SUPABASE_SERVICE_ROLE_KEY ||
            env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY ||
            "";
          console.log("url_host", url.replace(/^https?:\/\//, ""));
          console.log("has_database_url", Boolean(env.DATABASE_URL));
          (async () => {
            for (const t of ["config", "accounts", "duas"]) {
              const res = await fetch(`${url}/rest/v1/${t}?select=*&limit=1`, {
                headers: {
                  apikey: key,
                  Authorization: `Bearer ${key}`,
                },
              });
              const body = await res.text();
              console.log(
                t,
                res.status,
                body.includes("PGRST205") ? "missing" : "ok",
              );
            }
          })();
          NODE

      - name: Sync Makerkit env aliases
        if: steps.vercel.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_DB_WEBHOOK_SECRET: ${{ secrets.SUPABASE_DB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          eval "$(node -e '
            const fs=require("fs");
            for (const line of fs.readFileSync(".vercel/.env.production.local","utf8").split("\n")) {
              const t=line.trim();
              if(!t||t.startsWith("#")||!t.includes("=")) continue;
              const i=t.indexOf("=");
              const k=t.slice(0,i);
              let v=t.slice(i+1);
              if((v.startsWith("\"")&&v.endsWith("\""))||(v.startsWith("'\''")&&v.endsWith("'\''"))) v=v.slice(1,-1);
              if(["NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY","NEXT_PUBLIC_SUPABASE_ANON_KEY"].includes(k)) {
                const esc=v.replace(/'/g,"'\''");
                process.stdout.write("export "+k+"='\''"+esc+"'\''\n");
              }
            }
          ')"
          upsert() {
            local key="$1" value="$2"
            [ -z "$value" ] && echo "skip $key" && return 0
            local ids
            ids="$(curl -sS "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              | node -e 'const key=process.argv[1];const j=JSON.parse(require("fs").readFileSync(0,"utf8"));for(const e of (j.envs||[])){if(e.key===key&&(e.target||[]).includes("production"))console.log(e.id)}' "$key")"
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              curl -sS -X DELETE "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${id}?teamId=${VERCEL_ORG_ID}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" >/dev/null || true
            done <<< "$ids"
            curl -sS -X POST \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_ORG_ID}&upsert=true" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(node -e 'const[k,v]=process.argv.slice(1);process.stdout.write(JSON.stringify({key:k,value:v,type:"encrypted",target:["production"]}))' "$key" "$value")" \
              | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log("upserted",j.key||j.error||"ok")'
          }
          PUBLIC_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}}"
          upsert "NEXT_PUBLIC_SITE_URL" "https://www.duaprayer.com"
          upsert "NEXT_PUBLIC_SUPABASE_PUBLIC_KEY" "$PUBLIC_KEY"
          if [ -n "${SUPABASE_DB_WEBHOOK_SECRET:-}" ]; then
            upsert "SUPABASE_DB_WEBHOOK_SECRET" "$SUPABASE_DB_WEBHOOK_SECRET"
          fi

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: diagnose-and-sync-env
    steps:
      - name: Resolve credentials
        id: creds
        env:
          INPUT_TOKEN: ${{ inputs.supabase_access_token }}
          INPUT_PASSWORD: ${{ inputs.supabase_db_password }}
          SECRET_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SECRET_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          TOKEN="${INPUT_TOKEN:-$SECRET_TOKEN}"
          PASS="${INPUT_PASSWORD:-$SECRET_PASSWORD}"
          if [ -n "$TOKEN" ] && [ -n "$PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "has_password=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "has_token=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "has_password=$([ -n "$PASS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "::warning::Need both Supabase access token and DB password."
            echo "Run this workflow from the Actions tab and paste both inputs, or set SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD secrets."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: corepack enable && pnpm install --filter web...

      - name: Push Makerkit + community migrations
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/web
        env:
          SUPABASE_ACCESS_TOKEN: ${{ inputs.supabase_access_token || secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ inputs.supabase_db_password || secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm exec supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"
          pnpm exec supabase db push --include-all
          echo "Migrations pushed successfully."

      - name: Verify production healthcheck
        if: always()
        env:
          MIGRATE_READY: ${{ steps.creds.outputs.ready }}
        run: |
          set -euo pipefail
          sleep 8
          BODY="$(curl -sS "https://www.duaprayer.com/api/healthcheck" || true)"
          echo "$BODY"
          if echo "$BODY" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));process.exit(j?.services?.database===true?0:1)'; then
            echo "database healthy"
            exit 0
          fi
          echo "database still unhealthy"
          if [ "$MIGRATE_READY" = "true" ]; then
            exit 1
          fi
          exit 0
