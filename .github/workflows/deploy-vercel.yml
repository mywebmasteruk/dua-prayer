# Deploy DuaPrayer to Vercel production on every push to main.
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN        https://vercel.com/account/tokens (scope: full account or team)
#   VERCEL_ORG_ID       team_km2T92NwivBy9c85XLjhTScR  (from .vercel/project.json orgId)
#   VERCEL_PROJECT_ID   prj_8sQGGuKxXAfJdnHeRXuX0jh15dIk (from .vercel/project.json projectId)
#
# Vercel project env vars (Supabase, Stripe, etc.) must already be set in the Vercel dashboard.
# This workflow does not need iCloud or local CLI — build runs on GitHub-hosted Ubuntu.

name: Deploy Vercel Production

on:
  push:
    branches: [main]

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_FONT_GOOGLE_MOCKED: "1"
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
