# Deploy DuaPrayer (Makerkit monorepo) to Vercel production on push to main.
#
# Preferred: Vercel CLI prebuilt deploy (pulls Production env from Vercel).
# Fallback: Deploy Hook + poll GitHub Production deployment for the commit SHA.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN            https://vercel.com/account/tokens
#   VERCEL_DEPLOY_HOOK_URL  fallback if token is missing
#
# Org/project IDs are public project identifiers (also in DEPLOY.md).

name: Deploy Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_km2T92NwivBy9c85XLjhTScR
  VERCEL_PROJECT_ID: prj_8sQGGuKxXAfJdnHeRXuX0jh15dIk

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check for Vercel token
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN not set — will use deploy hook fallback"
          fi

      - name: Checkout
        if: steps.creds.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.creds.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node
        if: steps.creds.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Vercel CLI
        if: steps.creds.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel production env & project settings
        if: steps.creds.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (Vercel prebuilt)
        if: steps.creds.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: steps.creds.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Trigger Vercel deploy hook (fallback)
        if: steps.creds.outputs.has_token != 'true'
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::Neither VERCEL_TOKEN nor VERCEL_DEPLOY_HOOK_URL is configured"
            exit 1
          fi
          RESPONSE="$(curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            -d "ref=main" \
            --fail-with-body)"
          echo "hook_response=$RESPONSE"

      - name: Wait for GitHub Production deployment (hook fallback)
        if: steps.creds.outputs.has_token != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for Production deployment for $EXPECTED_SHA ..."
          DEADLINE=$((SECONDS + 900))
          LAST_STATE=""
          while (( SECONDS < DEADLINE )); do
            PAYLOAD="$(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=10")"
            DEPLOY_ID="$(echo "$PAYLOAD" | node -e '
              const sha = process.env.EXPECTED_SHA;
              const rows = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const match = rows.find((d) => d.sha === sha);
              if (!match) process.exit(3);
              process.stdout.write(String(match.id));
            ' || true)"
            if [[ -z "${DEPLOY_ID:-}" ]]; then
              echo "No Production deployment yet for $EXPECTED_SHA — waiting..."
              sleep 15
              continue
            fi
            STATUS_JSON="$(gh api "repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses")"
            STATE="$(echo "$STATUS_JSON" | node -e '
              const rows = JSON.parse(require("fs").readFileSync(0, "utf8"));
              process.stdout.write(rows[0]?.state || "pending");
            ')"
            DESC="$(echo "$STATUS_JSON" | node -e '
              const rows = JSON.parse(require("fs").readFileSync(0, "utf8"));
              process.stdout.write(rows[0]?.description || "");
            ')"
            if [[ "$STATE" != "$LAST_STATE" ]]; then
              echo "deployment=$DEPLOY_ID state=$STATE — $DESC"
              LAST_STATE="$STATE"
            fi
            case "$STATE" in
              success|inactive)
                echo "Production deployment succeeded."
                exit 0
                ;;
              failure|error)
                echo "::error::Production deployment failed: $DESC"
                echo "Inspect: npx vercel inspect <deployment> --logs"
                echo "Cutover fixes: Root Directory apps/web, disable Install/Build overrides, set Makerkit env vars (see DEPLOY.md)"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Production deployment for $EXPECTED_SHA"
          exit 1
