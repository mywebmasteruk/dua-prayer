# Deploy the PUBLIC DuaPrayer frontend (legacy/dua-prayer) to Vercel production.
#
# Architecture:
#   - Public site (www.duaprayer.com) = legacy/dua-prayer (original consumer UI)
#   - Makerkit (apps/web) = backoffice foundation — NOT the public frontend
#
# Secrets:
#   VERCEL_TOKEN            preferred (CLI prebuilt deploy)
#   VERCEL_DEPLOY_HOOK_URL  fallback

name: Deploy Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_km2T92NwivBy9c85XLjhTScR
  VERCEL_PROJECT_ID: prj_8sQGGuKxXAfJdnHeRXuX0jh15dIk
  # Public consumer app — original DuaPrayer frontend
  VERCEL_ROOT_DIRECTORY: legacy/dua-prayer

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check for Vercel token
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN not set — will use deploy hook fallback"
          fi

      - name: Checkout
        if: steps.creds.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.creds.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: steps.creds.outputs.has_token == 'true'
        run: npm install -g vercel@latest

      - name: Set Vercel Root Directory to legacy/dua-prayer
        if: steps.creds.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Public frontend is the original DuaPrayer app, not Makerkit apps/web.
          curl -sS -X PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"rootDirectory\":\"${VERCEL_ROOT_DIRECTORY}\",\"installCommand\":\"npm install --legacy-peer-deps\",\"buildCommand\":\"npm run build\",\"framework\":\"nextjs\"}" \
            | tee /tmp/vercel-project.json >/dev/null
          ROOT="$(node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/vercel-project.json","utf8")); process.stdout.write(j.rootDirectory || "")')"
          echo "rootDirectory=$ROOT"
          if [ "$ROOT" != "$VERCEL_ROOT_DIRECTORY" ]; then
            echo "::error::Failed to set Vercel rootDirectory to ${VERCEL_ROOT_DIRECTORY}"
            exit 1
          fi

      - name: Pull Vercel production env & project settings
        if: steps.creds.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (Vercel prebuilt)
        if: steps.creds.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt to production
        if: steps.creds.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Trigger Vercel deploy hook (fallback)
        if: steps.creds.outputs.has_token != 'true'
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::Neither VERCEL_TOKEN nor VERCEL_DEPLOY_HOOK_URL is configured"
            exit 1
          fi
          # Ensure project root points at legacy frontend before hook build
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            curl -sS -X PATCH \
              "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"rootDirectory\":\"${VERCEL_ROOT_DIRECTORY}\",\"installCommand\":\"npm install --legacy-peer-deps\",\"buildCommand\":\"npm run build\"}" \
              >/dev/null
          fi
          RESPONSE="$(curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            -d "ref=main" \
            --fail-with-body)"
          echo "hook_response=$RESPONSE"

      - name: Wait for GitHub Production deployment (hook fallback)
        if: steps.creds.outputs.has_token != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for Production deployment for $EXPECTED_SHA ..."
          DEADLINE=$((SECONDS + 900))
          LAST_STATE=""
          while (( SECONDS < DEADLINE )); do
            PAYLOAD="$(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=10")"
            DEPLOY_ID="$(echo "$PAYLOAD" | node -e '
              const sha = process.env.EXPECTED_SHA;
              const rows = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const match = rows.find((d) => d.sha === sha);
              if (!match) process.exit(3);
              process.stdout.write(String(match.id));
            ' || true)"
            if [[ -z "${DEPLOY_ID:-}" ]]; then
              echo "No Production deployment yet for $EXPECTED_SHA — waiting..."
              sleep 15
              continue
            fi
            STATUS_JSON="$(gh api "repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses")"
            STATE="$(echo "$STATUS_JSON" | node -e '
              const rows = JSON.parse(require("fs").readFileSync(0, "utf8"));
              process.stdout.write(rows[0]?.state || "pending");
            ')"
            DESC="$(echo "$STATUS_JSON" | node -e '
              const rows = JSON.parse(require("fs").readFileSync(0, "utf8"));
              process.stdout.write(rows[0]?.description || "");
            ')"
            if [[ "$STATE" != "$LAST_STATE" ]]; then
              echo "deployment=$DEPLOY_ID state=$STATE — $DESC"
              LAST_STATE="$STATE"
            fi
            case "$STATE" in
              success|inactive)
                echo "Production deployment succeeded."
                exit 0
                ;;
              failure|error)
                echo "::error::Production deployment failed: $DESC"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Production deployment for $EXPECTED_SHA"
          exit 1
